<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live javac REPL — OpenJDK on WebAssembly</title>
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script src="coi-serviceworker.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<style>
  main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
  @media(max-width:820px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}}
  .pane{display:flex;flex-direction:column;min-height:0;min-width:0}
  .pane.editor{border-right:1px solid var(--edge)}
  .pane .head{display:flex;align-items:center;gap:10px;padding:8px 14px;
    border-bottom:1px solid var(--edge);background:var(--panel2)}
  .pane .head .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
  .editor-wrap{flex:1;min-height:0;position:relative}
  .CodeMirror{position:absolute;inset:0;height:100%;font-family:var(--mono);font-size:13px}
  #console{flex:1;margin:0;overflow:auto;background:#0b0f14;color:var(--ink);
    font-family:var(--mono);font-size:12.5px;line-height:1.5;padding:14px;white-space:pre-wrap;word-break:break-word}
  #console .err{color:var(--err)}
  #console .sys{color:var(--faint)}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">⌨️</span>
  <h1>Live <b>javac</b> REPL</h1>
  <span class="spacer"></span>
  <select id="samples"></select>
  <button class="btn" id="run">Run ▸</button>
  <nav><a href="index.html">Home</a><a href="repl.html">REPL</a><a href="swing.html">Swing</a><a href="gl.html">3D</a><a href="fs.html">Files</a><a href="net.html">Net</a><a href="jit.html">JIT</a><a href="spring.html">Spring</a><a href="integrate.html">Docs</a></nav>
</div>

<main>
  <div class="pane editor">
    <div class="head"><span class="lbl">Main.java</span></div>
    <div class="editor-wrap"><textarea id="src"></textarea></div>
  </div>
  <div class="pane">
    <div class="head"><span class="lbl">Console</span><span style="flex:1"></span>
      <span class="status" id="status"><span class="dot"></span><span id="statusText">idle</span></span></div>
    <pre id="console"></pre>
  </div>
</main>

<script src="jvm/jvm-base.js"></script>
<script>
const $=(id)=>document.getElementById(id);
const con=$('console'), runBtn=$('run'), status=$('status'), statusText=$('statusText');

const SAMPLES={
  'Hello, world':`public class Main {
    public static void main(String[] args) {
        System.out.println("Hello from OpenJDK " + System.getProperty("java.version"));
        System.out.println("arch=" + System.getProperty("os.arch") + " os=" + System.getProperty("os.name"));
    }
}`,
  'Streams & records':`import java.util.*;
import java.util.stream.*;

public class Main {
    record Point(int x, int y) { int dist2() { return x*x + y*y; } }
    public static void main(String[] args) {
        List.of(new Point(3,4), new Point(1,1), new Point(6,8)).stream()
            .sorted(Comparator.comparingInt(Point::dist2))
            .forEach(p -> System.out.printf("%s -> %d%n", p, p.dist2()));
        System.out.println("sum = " + List.of(1,2,3,4,5).stream().mapToInt(i->i).sum());
    }
}`,
  'Hot loop (JIT)':`public class Main {
    static long collatz(long n){ long s=0; while(n!=1){ n=(n%2==0)?n/2:3*n+1; s++; } return s; }
    public static void main(String[] args){
        long t0=System.nanoTime(), best=0, bestN=0;
        for(long n=1;n<200_000;n++){ long s=collatz(n); if(s>best){best=s;bestN=n;} }
        System.out.printf("longest Collatz < 200k: n=%d, %d steps%n", bestN, best);
        System.out.printf("computed in %d ms%n", (System.nanoTime()-t0)/1_000_000);
    }
}`,
};

// CodeMirror editor with Java syntax highlighting.
const cm = CodeMirror.fromTextArea($('src'), {
  mode:'text/x-java', theme:'material-darker', lineNumbers:true,
  indentUnit:4, tabSize:4, matchBrackets:true,
  extraKeys:{ 'Cmd-Enter':()=>run(), 'Ctrl-Enter':()=>run() },
});
const sel=$('samples');
for(const n of Object.keys(SAMPLES)){ const o=document.createElement('option'); o.value=n; o.textContent=n; sel.appendChild(o); }
sel.onchange=()=>{ cm.setValue(SAMPLES[sel.value]); };
cm.setValue(SAMPLES[Object.keys(SAMPLES)[0]]);

function setStatus(c,t){ status.className='status '+c; statusText.textContent=t; }
function log(s,cls){ const sp=document.createElement('span'); if(cls)sp.className=cls;
  sp.textContent=s.endsWith('\n')?s:s+'\n'; con.appendChild(sp); con.scrollTop=con.scrollHeight; }

// ---- warm VM: boot ReplServer once, then drive it via /work/req + /work/resp ----
let mod=null, bootPromise=null, seq=0, phase='boot';
function boot(){
  if(bootPromise) return bootPromise;
  if(!window.crossOriginIsolated) return Promise.reject(new Error('not cross-origin isolated (reload to activate the service worker)'));
  if(!window.createJVM) return Promise.reject(new Error('runtime failed to load (jvm/jvm-base.js)'));
  setStatus('busy','downloading runtime…');
  bootPromise=(async()=>{
    const gz=await fetch('jvm/jvm-base.data.gz');
    if(!gz.ok) throw new Error('fetch jvm-base.data.gz '+gz.status);
    const buf=await new Response(gz.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    setStatus('busy','booting JVM (one time)…');
    await new Promise((resolve,reject)=>{
      let readySeen=false;
      window.createJVM({
        arguments:['ReplServer'],
        getPreloadedPackage:(n,s)=>buf,
        preRun:[M=>{ mod=M; M.ENV=M.ENV||{}; M.ENV.WASMJIT_ALL='1'; try{M.FS.mkdir('/work');}catch(e){} try{M.FS.writeFile('/work/req','0');}catch(e){} }],
        print:s=>{
          if(/unsupported syscall/.test(s)) return;
          if(!readySeen){ if(/\[repl\] ready/.test(s)){ readySeen=true; resolve(); } return; }
          if(phase!=='run') return;
          if(/^\[compiled |^\[ran /.test(s)) log(s.trim(),'sys'); else log(s);
        },
        printErr:s=>{ if(phase==='run' && !/unsupported syscall|Unknown module: java\.desktop/.test(s)) log(s,'err'); },
        onExit:()=>{ if(!readySeen) reject(new Error('VM exited during boot')); },
      });
    });
  })();
  return bootPromise;
}

let running=false;
async function run(){
  if(running) return;
  running=true; runBtn.disabled=true;
  try{
    const first = !bootPromise;
    await boot();
    con.textContent=''; phase='run'; seq++;
    const t0=performance.now();
    mod.FS.writeFile('/work/src.java', cm.getValue());
    mod.FS.writeFile('/work/req', String(seq));
    setStatus('busy', first ? 'compiling (first run warms javac)…' : 'compiling & running…');
    await new Promise((resolve)=>{ const iv=setInterval(()=>{ let r=''; try{ r=mod.FS.readFile('/work/resp',{encoding:'utf8'}).trim(); }catch(e){}
      if(r===String(seq)){ clearInterval(iv); resolve(); } },40); });
    setStatus('ok','done in '+((performance.now()-t0)/1000).toFixed(1)+'s');
  }catch(e){ log('Error: '+(e&&e.message||e),'err'); setStatus('err','error'); }
  finally{ phase='idle'; running=false; runBtn.disabled=false; }
}
runBtn.onclick=run;
log('Ready. Pick a sample or edit the code, then press Run (⌘/Ctrl+Enter).','sys');
log('First run boots the JVM (~5s); after that the VM stays warm and runs are ~1s.','sys');
</script>
</body>
</html>
