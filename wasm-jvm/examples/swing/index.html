<script>
  // ---- cross-app persistence ------------------------------------------------
  // Mount an IndexedDB-backed home so ANY app's file I/O under ~ survives reloads
  // (Minecraft worlds, editor files, caches...). Standard Java file I/O — no
  // per-app code: HOME points at the persistent mount, synced on load + flushed
  // periodically. Only active on JVM images linked with IDBFS (relink-gl.sh).
  let __persistMod = null;
  function persistMount(M) {
    if (!M.IDBFS) return;
    __persistMod = M;
    try {
      // user.home on emscripten is /home/web_user (getpwuid); mount IDBFS there
      try { M.FS.mkdir('/home'); } catch (e) {}
      try { M.FS.mkdir('/home/web_user'); } catch (e) {}
      M.FS.mount(M.IDBFS, {}, '/home/web_user');
      M.addRunDependency('idbfs');
      M.FS.syncfs(true, () => M.removeRunDependency('idbfs'));
    } catch (e) { console.log('persist init', e); }
  }
  setInterval(() => { if (__persistMod) { try { __persistMod.FS.syncfs(false, () => {}); } catch (e) {} } }, 4000);
  window.addEventListener('beforeunload', () => { if (__persistMod) { try { __persistMod.FS.syncfs(false, () => {}); } catch (e) {} } });

    public static void main(String[] args) {
        System.out.println("Compiled by javac and run on wasm — no JIT, pure interpreter.");
        var primes = new StringBuilder();
        for (int n = 2; n < 50; n++) {
            boolean prime = true;
            for (int d = 2; d * d <= n; d++)

            if (prime) primes.append(n).append(' ');
        }
        System.out.println("primes < 50: " + primes.toString().trim());
        System.out.println("running on: " + System.getProperty("java.vm.name"));
    }
}`

      code: `import java.awt.*;
import java.awt.geom.*;
import java.awt.image.*;

// Headless AWT: Graphics2D renders into a BufferedImage through the real
// libawt native loops (shapes/gradient/alpha) and the freetype/harfbuzz font
// stack (text), all compiled to WebAssembly. Pixels are blitted to a canvas.
public class Main {
    public static void main(String[] a) throws Exception {
        int W = 480, H = 300;
        BufferedImage img = new BufferedImage(W, H, BufferedImage.TYPE_INT_RGB);
        Graphics2D g = img.createGraphics();
        g.setRenderingHint(RenderingHints.KEY_ANTIALIASING,
                           RenderingHints.VALUE_ANTIALIAS_ON);
        g.setRenderingHint(RenderingHints.KEY_TEXT_ANTIALIASING,
                           RenderingHints.VALUE_TEXT_ANTIALIAS_ON);
        g.setPaint(new GradientPaint(0, 0, new Color(20,24,40),
                                     0, H, new Color(60,30,70)));
        g.fillRect(0, 0, W, H);
        g.setColor(new Color(255,200,60));
        g.fill(new Ellipse2D.Double(60, 70, 80, 80));
        Color[] cols = { new Color(255,80,80,160),
                         new Color(80,255,120,160),
                         new Color(80,160,255,160) };
        for (int i = 0; i < 3; i++) {
            g.setColor(cols[i]);
            g.fill(new Ellipse2D.Double(180 + i*60, 130, 130, 130));
        }
        for (int i = 0; i < 8; i++) {
            g.setColor(Color.getHSBColor(i/8f, 0.7f, 0.9f));
            int bh = 18 + i*12;
            g.fillRect(30 + i*24, H - 26 - bh, 18, bh);
        }
        g.setColor(Color.WHITE);
        g.setFont(new Font(Font.SANS_SERIF, Font.BOLD, 28));
        g.drawString("Hello, WebAssembly", 26, 44);
        g.setColor(new Color(180,200,255));
        g.setFont(new Font(Font.SANS_SERIF, Font.PLAIN, 14));
        g.drawString("OpenJDK HotSpot Zero · AWT/Java2D · freetype text", 28, 66);
        g.setColor(Color.WHITE);
        g.setStroke(new BasicStroke(3));
        g.drawRect(6, 6, W-12, H-12);
        g.dispose();

        // Hand the raw pixels to JS (P6 PPM in MEMFS) for the canvas blit.
        int[] px = ((DataBufferInt) img.getRaster().getDataBuffer()).getData();
        try (java.io.OutputStream os = new java.io.BufferedOutputStream(
                 new java.io.FileOutputStream("/work/awt_out.ppm"))) {
            os.write(("P6\\n" + W + " " + H + "\\n255\\n").getBytes("US-ASCII"));
            byte[] row = new byte[W*3];
            for (int y = 0; y < H; y++) {
                for (int x = 0; x < W; x++) {
                    int rgb = px[y*W + x];
                    row[x*3]   = (byte)((rgb>>16)&0xff);
                    row[x*3+1] = (byte)((rgb>>8)&0xff);
                    row[x*3+2] = (byte)(rgb&0xff);
                }
                os.write(row);
            }
        }
        System.out.println("[rendered " + W + "x" + H + " on wasm AWT, blitting to canvas]");
    }
}`

      code: `import java.awt.*;
import java.awt.geom.*;
import java.awt.image.*;
import java.io.*;
import javax.swing.*;
import javax.swing.plaf.metal.MetalLookAndFeel;

// A Swing app running headless on the wasm JVM. Each frame paints a real
// Metal JButton (offscreen, via its UI delegate) and an animated ball into a
// BufferedImage, published to the browser canvas. Canvas clicks are written to
// /work/ctrl; the loop hit-tests the button and drops the ball under gravity.
public class Ball {
    static final int W = 440, H = 320, R = 18;
    static final double LEDGE_Y = 150, GROUND_Y = H - 26;
    static final int BX = W/2 - 78, BY = H - 60, BW = 156, BH = 38;

    public static void main(String[] args) throws Exception {
        UIManager.setLookAndFeel(new MetalLookAndFeel());
        JButton button = new JButton("Drop the ball!");
        button.setSize(BW, BH);
        CellRendererPane rp = new CellRendererPane();
        BufferedImage img = new BufferedImage(W, H, BufferedImage.TYPE_INT_RGB);

        double x = 40, y = LEDGE_Y - R, vx = 2.4, vy = 0, spin = 0;
        boolean falling = false, onGround = false;
        long lastClick = -1;

        for (;;) {
            long[] c = readClick();                 // {seq, x, y} from JS, or null
            if (c != null && c[0] != lastClick) {
                lastClick = c[0];
                if (c[1] >= BX && c[1] <= BX+BW && c[2] >= BY && c[2] <= BY+BH) {
                    if (!falling && !onGround) { falling = true; vy = 0; }
                    else { falling = onGround = false; y = LEDGE_Y - R; }
                }
            }
            if (!falling && !onGround) {             // roll
                x += vx; spin += vx / R;
                if (x < R+16 || x > W-R-16) vx = -vx;
            } else if (falling) {                     // fall + bounce
                vy += 0.9; y += vy; spin += 0.04;
                if (y >= GROUND_Y - R) { y = GROUND_Y - R;
                    if (vy > 1.5) vy = -vy*0.55; else { vy = 0; falling = false; onGround = true; } }
            }
            Graphics2D g = img.createGraphics();
            paintScene(g, button, rp, x, y, spin, falling, onGround);
            g.dispose();
            publish(img);                             // -> /work/frame.ppm -> canvas
            Thread.sleep(33);
        }
    }
    // ... paintScene(), readClick(), publish() render the frame and marshal I/O
}`

    const t = TEMPLATES[key];
    editor.value = t.code; ehint.textContent = t.hint;
    const isAwt = !!(t.render || t.interactive);
    const isGl = !!t.gl;
    document.body.classList.toggle('game', isGl);   // give GL/games the main stage
    canvasbox.style.display = isAwt ? 'flex' : 'none';
    const glc = document.getElementById('glsurface');
    const awtc = document.getElementById('awtcanvas');
    // GL/Minecraft present WebGL frames straight to #glsurface; AWT/Swing blit
    // CPU pixels to #awtcanvas. Show whichever the selected mode renders into.
    glc.style.display = isGl ? 'block' : 'none';
    awtc.style.display = (isAwt && !isGl) ? 'block' : 'none';
    if (isGl) {
      glc.width = t.cw || 854; glc.height = t.ch || 480;
      glc.style.width = '100%'; glc.style.height = 'auto';
      glc.style.maxHeight = '100%'; glc.style.objectFit = 'contain';
      glc.style.border = '1px solid var(--edge)'; glc.style.borderRadius = '6px';
    }
    canvashint.style.display = isAwt ? 'inline' : 'none';
    fsBtn.style.display = isAwt ? 'flex' : 'none';
    exitFull();
  }
  // Full-screen (fill the viewport) for the draw area. The browser Fullscreen API
  // hijacks Esc, so we use a CSS overlay and reserve a *double* Esc to exit — that
  // leaves a single Esc free for the running app.
  function enterFull() { canvasbox.classList.add('expanded'); }
  function exitFull()  { canvasbox.classList.remove('expanded'); }
  fsBtn.addEventListener('click', () => {
    if (canvasbox.classList.contains('expanded')) exitFull(); else enterFull();
  });
  let lastEsc = 0;
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && canvasbox.classList.contains('expanded')) {
      const now = performance.now();
      if (now - lastEsc < 600) { exitFull(); lastEsc = 0; } else lastEsc = now;
    }
  });
  function paintPPM(bytes) {
    // parse binary P6: "P6\n<w> <h>\n255\n" + RGB triples
    let p = 0; const tok = () => { while (bytes[p]===32||bytes[p]===10||bytes[p]===9) p++;
      let s=''; while (p<bytes.length && bytes[p]!==32 && bytes[p]!==10 && bytes[p]!==9) s+=String.fromCharCode(bytes[p++]); return s; };
    if (tok() !== 'P6') return false;
    const w = +tok(), h = +tok(); tok(); p++; // skip maxval + single whitespace
    const cv = document.getElementById('awtcanvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d'); const imgd = ctx.createImageData(w, h);
    for (let i = 0, o = 0; i < w*h; i++) {
      imgd.data[o++] = bytes[p++]; imgd.data[o++] = bytes[p++]; imgd.data[o++] = bytes[p++]; imgd.data[o++] = 255;
    }
    ctx.putImageData(imgd, 0, 0); return true;
  }
  setTemplate('plain');
  tsel.addEventListener('change', () => setTemplate(tsel.value));

  function append(text, cls) {
    const span = document.createElement('span');
    span.className = cls || 'sys';
    span.textContent = text + "\n";
    consoleEl.appendChild(span);
    consoleEl.scrollTop = consoleEl.scrollHeight;
  }
  function classify(line) {
    if (line.startsWith('[compiled') || line.startsWith('[ran') || line.startsWith('[classpath')) return 'ok';
    if (line.startsWith('[launcher]')) return 'sys';
    if (/^(ERROR|error|--- |Exception|\tat )/.test(line)) return 'err';
    if (line.startsWith('warning:')) return 'sys';
    return 'out';
  }
  function loadScript(src) {
    if (loaded[src]) return loaded[src];
    loaded[src] = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src; s.onload = res; s.onerror = () => rej(new Error('failed to load ' + src));
      document.body.appendChild(s);
    });
    return loaded[src];
  }

  editor.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); runBtn.click(); }
  });

  // Auto-run hook for automation/screenshots: #run-awt selects the AWT template and runs.
  window.addEventListener('load', () => {
    const m = location.hash.match(/^#run-(\w+)$/);
    if (m && TEMPLATES[m[1]]) { tsel.value = m[1]; setTemplate(m[1]); setTimeout(() => runBtn.click(), 300); }
  });

  runBtn.addEventListener('click', async () => {
    const tpl = TEMPLATES[tsel.value];
    const source = editor.value;
    runBtn.disabled = true;
    consoleEl.innerHTML = '';
    cdot.classList.add('live');
    append(tsel.value === 'spring'
      ? 'Booting the JVM, compiling with javac, starting the Spring container…'
      : 'Booting HotSpot Zero VM and compiling with javac…', 'banner');
    const t0 = performance.now();
    let finished = false;
    const finish = (code) => {
      if (finished) return; finished = true;
      const dt = ((performance.now() - t0) / 1000).toFixed(2);
      append(`\n— VM exited (code ${code}) in ${dt}s —`, 'banner');
      cdot.classList.remove('live'); runBtn.disabled = false;
    };

    // Interactive templates run a never-ending Swing loop: start the JVM, then
    // drive the canvas from JS (blit frames every rAF, forward clicks to /work/ctrl).
    if (tpl.interactive) {
      append('Booting the wasm JVM and starting the Swing app…', 'banner');
      let mod = null, clickSeq = 0;
      loadScript(tpl.script).then(() => window[tpl.factory]({
        arguments: tpl.args,
        ...(tpl.net ? { websocket: { url: 'ws://localhost:8090/', subprotocol: null } } : {}),
        preRun: [ (M) => { mod = M; try { M.FS.mkdir('/work'); } catch (e) {}
                           persistMount(M);
                           if (tpl.bridge) { try { M.FS.writeFile('/work/bridge', tpl.bridge); } catch (e) {} } } ],
        print:    (s) => append(s, classify(s)),
        printErr: (s) => append(s, s.startsWith('[launcher]') || /Ignoring|warning:/.test(s) ? 'sys' : 'err'),
      }));
      const BW_ = tpl.cw || 440, BH_ = tpl.ch || 320;   // canvas dimensions per template
      // GL modes render straight to #glsurface (WebGL); AWT modes blit to #awtcanvas.
      const cv = document.getElementById(tpl.gl ? 'glsurface' : 'awtcanvas');
      cv.width = BW_; cv.height = BH_;
      const ctx = tpl.gl ? null : cv.getContext('2d');
      cv.style.cursor = 'pointer';
      cv.style.touchAction = 'none';
      cv.tabIndex = 0;   // focusable so it receives key events

      // queue templates use an append-log (no event coalescing); others overwrite
      const enc = new TextEncoder();
      let ctrlFd = null;
      const writeCtrl = (line) => {
        if (!mod) return;
        try {
          if (tpl.queue) {
            if (ctrlFd == null) ctrlFd = mod.FS.open('/work/ctrl', 'a');
            const b = enc.encode(line); mod.FS.write(ctrlFd, b, 0, b.length);
          } else {
            mod.FS.writeFile('/work/ctrl', line);
          }
        } catch (_) {}
      };
      let dragging = false;
      // Map a client point to canvas pixels, accounting for object-fit:contain
      // letterboxing (the drawn image is centered/scaled inside the element box).
      const toCanvas = (e) => {
        const r = cv.getBoundingClientRect();
        const scale = Math.min(r.width / cv.width, r.height / cv.height);
        const dw = cv.width * scale, dh = cv.height * scale;
        const ox = r.left + (r.width - dw) / 2, oy = r.top + (r.height - dh) / 2;
        let x = Math.round((e.clientX - ox) / scale), y = Math.round((e.clientY - oy) / scale);
        return [Math.max(0, Math.min(cv.width - 1, x)), Math.max(0, Math.min(cv.height - 1, y))];
      };
      const sendPtr = (state, e) => {
        const [x, y] = toCanvas(e);
        clickSeq++; writeCtrl(clickSeq + ' ' + state + ' ' + x + ' ' + y + '\n');
      };
      cv.addEventListener('pointerdown', (e) => { dragging = true; cv.focus(); cv.setPointerCapture(e.pointerId); sendPtr(1, e); });
      cv.addEventListener('pointermove', (e) => { if (dragging) sendPtr(2, e); else if (tpl.mousemove) sendPtr(6, e); });
      cv.addEventListener('pointerup',   (e) => { if (dragging) { dragging = false; sendPtr(3, e); } });

      if (tpl.wheel) {
        cv.addEventListener('wheel', (e) => {
          e.preventDefault();
          clickSeq++;
          const dy = Math.max(-80, Math.min(80, Math.round(e.deltaY)));
          writeCtrl(clickSeq + ' 5 0 ' + dy + '\n');
        }, { passive: false });
      }

      if (tpl.keyboard) {
        // named keys -> java.awt.event.KeyEvent VK_* codes (charCode stays 0)
        const VK = { Backspace:8, Tab:9, Enter:13, Shift:16, Control:17, Alt:18,
          Escape:27, ' ':32, PageUp:33, PageDown:34, End:35, Home:36,
          ArrowLeft:37, ArrowUp:38, ArrowRight:39, ArrowDown:40, Delete:127 };
        cv.addEventListener('keydown', (e) => {
          let keyCode = 0, charCode = 0;
          if (e.key in VK) keyCode = VK[e.key];
          if (e.key.length === 1) charCode = e.key.charCodeAt(0);   // printable (incl. space)
          if (keyCode === 0 && charCode === 0) return;              // ignore pure modifiers etc.
          e.preventDefault();
          clickSeq++; writeCtrl(clickSeq + ' 4 ' + keyCode + ' ' + charCode + '\n');
        });
      }
      let firstShown = false, lastSeq = -1;
      const draw = () => {
        if (mod) {
          try {
            // only re-read the (large) frame when the tiny seq file advances
            const seq = mod.FS.readFile('/work/seq', { encoding: 'utf8' });
            if (seq !== lastSeq) {
              lastSeq = seq;
              const d = mod.FS.readFile('/work/frame.bin');           // raw RGBA
              // frame size is whatever the app published (e.g. MC 854x480); adapt
              let W = BW_, H = BH_, px = d.length / 4;
              if (W * H !== px) {
                for (const [kw, kh] of [[854,480],[640,460],[480,360],[440,320]])
                  if (kw*kh === px) { W = kw; H = kh; break; }
                if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
              }
              const imgd = new ImageData(new Uint8ClampedArray(d.buffer, d.byteOffset, W*H*4), W, H);
              ctx.putImageData(imgd, 0, 0);
              if (!firstShown) { firstShown = true;
                append('[Swing app live — click the button on the canvas]', 'ok'); }
            }
          } catch (_) { /* frame not ready yet */ }
        }
        requestAnimationFrame(draw);
      };
      if (!tpl.gl) requestAnimationFrame(draw);   // GL self-presents to #glsurface
      runBtn.disabled = false;
      return;
    }

    try {
      await loadScript(tpl.script);
      const factory = window[tpl.factory];
      let mod = null;
      await factory({
        arguments: tpl.args || ['Runner'],
        preRun: [ (M) => {
          mod = M;
          try { M.FS.mkdir('/work'); } catch (e) {}
          persistMount(M);
          M.FS.writeFile('/work/src.java', source);
          // Preloaded /app contents mount only after preRun, so we can't copy the
          // jars here — instead point Runner at the (baked) dir via a marker file.
          if (tpl.uselib) M.FS.writeFile('/work/uselib', tpl.uselib);
          if (tpl.bridge) M.FS.writeFile('/work/bridge', tpl.bridge);
        } ],
        print:    (s) => append(s, classify(s)),
        printErr: (s) => append(s, s.startsWith('[launcher]') ? 'sys' : /warning:|Ignoring/.test(s) ? 'sys' : 'err'),
        onExit:   (code) => {
          if (tpl.render && mod) {
            try { const d = mod.FS.readFile('/work/awt_out.ppm');
                  if (paintPPM(d)) append('[canvas updated from wasm AWT pixels]', 'ok'); }
            catch (e) { append('canvas: ' + e.message, 'err'); }
          }
          finish(code);
        },
      });
    } catch (e) {
      if (e && e.name === 'ExitStatus') finish(e.status ?? 0);
      else { append('Failed to start: ' + e, 'err'); cdot.classList.remove('live'); runBtn.disabled = false; }
    }
  });
</script>
</body>
</html>
